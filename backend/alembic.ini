# Alembic configuration for life-insurance needs analyzer.
# Run:  alembic upgrade head
# From: backend/

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# The connection comes from the DATABASE_URL (and optional DB_SSL_ROOT_CERT)
# environment variables, read in app/db/migrations/env.py. Never put a URL here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
