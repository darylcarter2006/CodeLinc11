name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: insurance_test
          POSTGRES_USER: insurance
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type check
        run: mypy app tests

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://insurance:testpass@localhost:5432/insurance_test
        run: alembic upgrade head

      - name: Tests (in-memory store)
        run: pytest --cov=app --cov-fail-under=90

      - name: API tests (PostgreSQL store)
        env:
          REPOSITORY_BACKEND: postgres
          DATABASE_URL: postgresql+asyncpg://insurance:testpass@localhost:5432/insurance_test
        run: pytest tests/api

      - name: Build container image
        run: docker build -t insurance-backend:${{ github.sha }} .
