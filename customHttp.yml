# Security headers for the Amplify-hosted front end. Amplify reads this from the repo root and it
# overrides anything under Hosting > Custom headers in the console. Keep the Content-Security-Policy
# in step with frontend/vite.config.ts (used by `npm run preview`), and if the API URL changes,
# update connect-src too.
applications:
  - appRoot: frontend
    customHeaders:
      - pattern: '**'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(), payment=()
          # Google sign-in needs its popup to talk back to this page.
          - key: Cross-Origin-Opener-Policy
            value: same-origin-allow-popups
          - key: Content-Security-Policy
            value: >-
              default-src 'self';
              script-src 'self' https://accounts.google.com/gsi/client;
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data: https://*.googleusercontent.com;
              connect-src 'self' https://co-de87df831d984b53ac41bf3936a98606.ecs.us-east-2.on.aws https://accounts.google.com/gsi/;
              frame-src https://accounts.google.com/gsi/;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self';
              object-src 'none';
              upgrade-insecure-requests
      # Hashed build assets never change; the HTML is always revalidated so deploys show up at once.
      - pattern: '/assets/**'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - pattern: '/index.html'
        headers:
          - key: Cache-Control
            value: no-cache
